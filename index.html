<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIGHT pallet LINE | G1 管理画面デモ</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./admin.mjs"></script>
</head>
<body>
  <header><div class="header-inner"><a href="./" class="brand">NIGHT pallet <strong>LINE</strong></a><span id="account"></span></div></header>
  <main id="main">
    <section class="demo" aria-label="デモの案内"><div><h2>G1 管理画面デモ</h2><p>架空の店舗・公式アカウントで接続の進捗や配信停止を確認できます。認証・LINE通信は模擬し、変更は再読み込みで元に戻ります。</p></div><button id="reset-demo" type="button" class="secondary">最初の状態に戻す</button></section>
    <p id="notice" role="status" aria-live="polite"></p>
    <section id="workspace" hidden>
      <div class="heading">
        <div><p class="section-label">法人</p><h1 id="tenant-name"></h1></div>
        <span class="status">閲覧用サンプル</span>
      </div>
      <div id="content"></div>
    </section>
  </main>
  <template id="store-fields">
    <label>店舗名<input name="name" maxlength="100" required></label>
    <label>所在地<input name="address" maxlength="240" required></label>
    <label>営業区分<input name="business_type" maxlength="120" required></label>
    <label>責任者<input name="responsible" maxlength="120" required></label>
    <label>タイムゾーン<input name="timezone" value="Asia/Tokyo" required></label>
    <label>営業日の締め時刻<input name="cutoff" type="time" value="06:00" required></label>
  </template>
  <template id="channel-fields">
    <label>公式アカウント名<input name="label" required></label>
    <label>用途<select name="purpose"><option value="customer">顧客</option><option value="recruitment">採用</option><option value="shared">顧客・採用兼用</option></select></label>
    <label>所有法人<input name="owner_name" required></label>
    <label>管理権限の確認記録<input name="management_authority" required></label>
    <label>プロバイダーID<input name="provider_id" required></label>
    <label>Messaging API チャネルID<input name="messaging_id" inputmode="numeric" required></label>
    <label>LINEログイン チャネルID<input name="login_id" inputmode="numeric" required></label>
    <label>LIFF ID<input name="liff_id" required></label>
    <label>ボットユーザーID<input name="bot_user_id" required></label>
    <label>認証種別<select name="account_type"><option value="unverified">未認証</option><option value="verified">認証済み</option><option value="premium">プレミアム</option></select></label>
    <label>既存Webhook URL<input name="existing_webhook" type="url" placeholder="任意"></label>
    <label>利用中のツール<input name="existing_tools" placeholder="任意"></label>
  </template>
</body>
</html>
